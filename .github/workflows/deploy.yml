name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # Typecheck, lint, test, build, and audit. BASE_PATH is "/<repo>/" for project sites;
      # VITE_SITE_URL makes canonical, sitemap and Open Graph URLs absolute (see README "SEO").
      - run: npm run verify
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Optional: the OAuth client ID for "Like on YouTube" (docs/youtube-like-setup.md).
          VITE_YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
